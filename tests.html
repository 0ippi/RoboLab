<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboLab-testit</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #0f1115; color: #e6e8eb; }
  h1 { font-size: 20px; }
  .pass { color: #3ecf8e; } .fail { color: #f2555a; }
  li { margin: 2px 0; } code { color: #a4abb6; }
</style>
</head>
<body>
<h1>RoboLab — laskimien yksikkötestit</h1>
<p id="summary"></p>
<ul id="out"></ul>
<script>window.ROBOLAB_LANG = "fi"; // testit tarkistavat suomenkielisiä viestejä</script>
<script src="i18n.js"></script>
<script src="calc.js"></script>
<script src="kin.js"></script>
<script src="motion.js"></script>
<script src="plan.js"></script>
<script src="robot.js"></script>
<script src="plot.js"></script>
<script src="robosim/core/util.js"></script>
<script src="robosim/core/brain.js"></script>
<script src="robosim/core/trainer.js"></script>
<script src="robosim/core/models.js"></script>
<script src="robosim/core/robot.js"></script>
<script src="robosim/core/deploy.js"></script>
<script src="robosim/core/tasks.js"></script>
<script src="robosim/core/usb.js"></script>
<script>
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, msg: e.message }); }
  }
  function near(actual, expected, tol, what = "") {
    if (!(Math.abs(actual - expected) <= tol)) throw new Error(`${what} odotettiin ${expected} ± ${tol}, saatiin ${actual}`);
  }
  function eq(actual, expected, what = "") {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${what} odotettiin ${JSON.stringify(expected)}, saatiin ${JSON.stringify(actual)}`);
  }

  const pidBase = { kp: 0, ki: 0, kd: 0, plant: "first", T: 5, K: 1, tau: 0.5, m: 1, b: 0.5,
                    setpoint: 1, umax: 0, antiWindup: true, dTau: 0, distT: 0, distMag: 0 };

  /* PID */
  test("P-säädin, 1. kertaluku: loppuarvo = K·Kp / (1 + K·Kp)", () => {
    const sim = Calc.simulatePid({ ...pidBase, kp: 4 });
    near(sim.y.at(-1), 4 / 5, 1e-3, "loppuarvo");
  });
  test("PI-säädin poistaa pysyvän virheen", () => {
    const sim = Calc.simulatePid({ ...pidBase, kp: 2, ki: 4, T: 10 });
    near(Calc.stepMetrics(sim, 1).sse, 0, 0.005, "pysyvä virhe");
  });
  test("1. kertaluvun käyrän nousuaika 10–90 % = τ·ln 9", () => {
    // Tunnuslukufunktio tarkistetaan analyyttisellä käyrällä 1 − e^(−t/τ)
    const tau = 0.5, t = [], y = [];
    for (let i = 0; i <= 5000; i++) { t.push(i * 0.001); y.push(1 - Math.exp(-t[i] / tau)); }
    near(Calc.stepMetrics({ t, y }, 1).rise, tau * Math.log(9), 0.002, "nousuaika");
  });
  test("Ylitys lasketaan oikein", () => {
    const t = [0, 1, 2, 3], y = [0, 1.3, 0.95, 1];
    near(Calc.stepMetrics({ t, y }, 1).overshoot, 30, 1e-9, "ylitys");
  });
  test("Liian suuret vahvistukset massalle tunnistetaan epästabiiliksi", () => {
    const sim = Calc.simulatePid({ ...pidBase, plant: "mass", b: 0, kp: 5, ki: 200, T: 20 });
    if (!sim.unstable) throw new Error("ei tunnistettu epästabiiliksi");
  });
  test("Ohjauksen raja pitää u:n rajoissa", () => {
    const sim = Calc.simulatePid({ ...pidBase, kp: 50, umax: 2 });
    if (Math.max(...sim.u.map(Math.abs)) > 2 + 1e-12) throw new Error("u ylitti rajan");
  });

  /* Moottori */
  const motorBase = { mass: 1, wheelD: 0.1, motors: 2, rpm: 60, stallTorque: 0.5, stallCurrent: 2,
                      ratio: 1, eff: 1, noLoadCurrent: 0.1, vNom: 6, vBat: 6, crr: 0, slopeDeg: 0, mu: 1, driveShare: 1 };
  test("Huippunopeus = rpm·π·D/60", () => {
    near(Calc.motor(motorBase).v0, Math.PI * 0.1, 1e-9, "v0");
  });
  test("Vetovoima = n·T/r", () => {
    near(Calc.motor(motorBase).Fs, 2 * 0.5 / 0.05, 1e-9, "Fs");
  });
  test("Ilman vastusta ajonopeus = huippunopeus ja virta = tyhjäkäyntivirta", () => {
    const r = Calc.motor(motorBase);
    near(r.vOp, r.v0, 1e-9, "vOp");
    near(r.iTotal, 0.2, 1e-9, "virta");
  });
  test("Välityssuhde 2 puolittaa nopeuden ja tuplaa momentin", () => {
    const a = Calc.motor(motorBase), b = Calc.motor({ ...motorBase, ratio: 2 });
    near(b.v0, a.v0 / 2, 1e-9, "v0"); near(b.Fs, a.Fs * 2, 1e-9, "Fs");
  });
  test("Puolikas jännite puolittaa nopeuden ja momentin", () => {
    const a = Calc.motor(motorBase), b = Calc.motor({ ...motorBase, vBat: 3 });
    near(b.v0, a.v0 / 2, 1e-9, "v0"); near(b.Fs, a.Fs / 2, 1e-9, "Fs");
  });
  test("Mäki, johon voima ei riitä → robotti ei liiku", () => {
    const r = Calc.motor({ ...motorBase, stallTorque: 0.01, slopeDeg: 30 });
    eq(r.moves, false, "moves"); eq(r.vOp, 0, "vOp");
  });
  test("Jyrkin mäki: m·g·sinθ = Fs (ilman vierintävastusta)", () => {
    const r = Calc.motor({ ...motorBase, stallTorque: 0.05, mu: 5 });
    near(r.maxSlope, Math.asin(r.Fs / (1 * Calc.G)) * 180 / Math.PI, 1e-9, "kulma");
  });
  test("Pito rajoittaa: kaltevuus ≤ atan(μ)", () => {
    const r = Calc.motor({ ...motorBase, mu: 0.3 });
    near(r.maxSlope, Math.atan(0.3) * 180 / Math.PI, 1e-9, "kulma");
    eq(r.tractionLimited, true, "tractionLimited");
  });

  /* Neuroverkko ja koulutusalgoritmit (RoboSim) */
  test("Neuroverkko: parametrien määrä = Σ ulos·(sisään+1)", () => {
    eq(RS.Brain.paramCount([3, 4, 2]), 4 * 4 + 2 * 5, "paramCount");
  });
  test("Neuroverkko: ulostulot välillä −1…1 (tanh)", () => {
    const L = [3, 8, 2], b = new RS.Brain(L), p = RS.Brain.randomParams(L).map((v) => v * 20);
    const out = b.forward(p, [5, -3, 1]);
    eq(out.length, 2, "pituus");
    if (![...out].every((v) => v >= -1 && v <= 1)) throw new Error("ulostulo ylittää rajat");
  });
  test("Evoluutiostrategia löytää yksinkertaisen tehtävän optimin", () => {
    const L = [2, 1], target = 0.5;
    const t = RS.makeTrainer("es", L, { popSize: 21, sigma: 0.1, lr: 0.05 }, new Float32Array(3));
    for (let g = 0; g < 300; g++) t.tell(t.ask().map((p) => -p.reduce((s, v) => s + (v - target) ** 2, 0)));
    t.mean.forEach((v, i) => near(v, target, 0.1, `paino ${i}`));
  });
  test("Geneettinen algoritmi parantaa tulosta", () => {
    const L = [2, 1], f = (p) => -p.reduce((s, v) => s + (v - 0.5) ** 2, 0);
    const t = RS.makeTrainer("ga", L, { popSize: 30, sigma: 0.1, lr: 0 }, new Float32Array(3));
    const first = f(new Float32Array(3));
    for (let g = 0; g < 150; g++) t.tell(t.ask().map(f));
    if (!(t.bestFitness > first * 0.1)) throw new Error(`paras ${t.bestFitness}, alku ${first}`);
  });

  /* Aivojen vienti omalle robotille */
  test("Vienti: sisääntuloja ja moottoreita yhtä monta kuin simulaatiossa (kaikki 2D-mallit)", () => {
    for (const [k, raw] of Object.entries(RS.MODELS)) {
      const m = RS.normalizeModel(raw), info = RS.modelInfo(m), d = RS.deployInfo("2d", m);
      eq(d.inputs.length, info.obsSize, k + " sisääntulot"); eq(d.outputs.length, info.actSize, k + " moottorit");
      eq(new Set(d.inputs.map((x) => x.id)).size, d.inputs.length, k + " yksilölliset nimet");
    }
  });
  test("Vienti: float32-luvut palautuvat täsmälleen tekstistä", () => {
    for (let n = 0; n < 500; n++) {
      const v = Math.fround((Math.random() - 0.5) * 10 ** Math.round(Math.random() * 8 - 5));
      eq(Math.fround(+RS.f32str(v)), v, "luku " + v);
    }
    eq(RS.cf(6), "6.0f", "kokonaisluku C:ssä"); eq(RS.cf(0), "0.0f", "nolla C:ssä");
  });
  const deployCase = () => {
    const m = RS.normalizeModel(RS.MODELS.car), info = RS.modelInfo(m), layers = [info.obsSize, 8, info.actSize];
    return { dim: "2d", model: m, layers, params: RS.Brain.randomParams(layers), name: "Testiauto", gen: 5, task: "eteen" };
  };
  test("Vienti JSON: tiedoston painoilla laskettu verkko = simulaation verkko", () => {
    const c = deployCase(), j = JSON.parse(RS.deployCode("json", c).code);
    let x = j.selftest.input, k = 0;
    for (let l = 1; l < j.layers.length; l++) {
      const y = [];
      for (let o = 0; o < j.layers[l]; o++) { let s = 0; for (const v of x) s += j.params[k++] * v; y.push(Math.tanh(s + j.params[k++])); }
      x = y;
    }
    eq(k, j.params.length, "kaikki painot käytetty");
    x.forEach((v, i) => near(v, j.selftest.output[i], 1e-6, "ulostulo " + i)); // välikerrokset tallentuvat float32:na
    const ref = new RS.Brain(c.layers).forward(c.params, RS.deployTestInput(c.layers[0]));
    x.forEach((v, i) => near(v, ref[i], 1e-6, "simulaatio " + i));
  });
  test("Vienti C ja Python: kaikki painot ja sisääntulot mukana", () => {
    const c = deployCase(), n = c.params.length;
    for (const t of ["arduino", "c", "python"]) {
      const code = RS.deployCode(t, c).code;
      const body = t === "python" ? code.split("PARAMS = array('f', [")[1].split("])")[0] : code.split("rl_params[] RL_STORE = {")[1].split("};")[0];
      eq(body.split(",").filter((s) => s.trim()).length, n, t + " painot");
      if (t !== "c" && !RS.deployInfo("2d", c.model).inputs.every((x) => code.includes((t === "python" ? "x[IN_" : "rlIn[RL_IN_") + x.id + "]"))) throw new Error(t + ": sisääntulo puuttuu");
    }
  });
  test("Roottorit: drooni saa ohjattavat roottorit ja ne näkyvät viedyssä koodissa", () => {
    const m = RS.normalizeModel(RS.MODELS.zippy), info = RS.modelInfo(m);
    eq([info.motors, info.thrusters, info.actSize], [0, 2, 2], "moottorit, roottorit, ulostulot");
    const layers = [info.obsSize, 4, info.actSize];
    const code = RS.deployCode("arduino", { dim: "2d", model: m, layers, params: RS.Brain.randomParams(layers), name: "Zippy" }).code;
    if (!code.includes("t0_thrust") || !code.includes("t1_thrust")) throw new Error("roottorien ohjaus puuttuu koodista");
  });
  /* Kävelypalkkio */
  const walkState = (o) => ({ x: 0, prevX: 0, y: 1, startY: 1, upright: 1, energy: 0, footContacts: 2, fallen: false, ...o });
  test("Kävely: eteneminen pystyssä palkitaan, ryömiminen ei", () => {
    const f = RS.compileTask(RS.TASKS.walk.code);
    const up = f(walkState({ x: 0.01 }), {}), crawl = f(walkState({ x: 0.01, upright: 0.1, y: 0.4 }), {});
    if (!(up > crawl)) throw new Error(`pystyssä ${up} ≤ ryömien ${crawl}`);
  });
  test("Kävely: askel (maakosketusten muutos) antaa bonuksen, kaatuminen lopettaa", () => {
    const f = RS.compileTask(RS.TASKS.walk.code), m = { feet: 2 };
    const step = f(walkState({ footContacts: 1 }), m), still = f(walkState({ footContacts: 1 }), m);
    if (!(step > still)) throw new Error("askelbonus puuttuu");
    const s = walkState({ fallen: true });
    if (!(f(s, {}) < -4) || !s.done) throw new Error("kaatuminen ei rankaise tai lopeta");
  });

  /* USB-live-linkki */
  test("Live-linkin luonnoksessa yhtä monta sisään- ja ulostuloa kuin aivoissa", () => {
    const m = RS.normalizeModel(RS.MODELS.car), info = RS.deployInfo("2d", m);
    const code = RS.USB.linkSketch(info);
    if (!code.includes(`N_IN = ${info.inputs.length}`) || !code.includes(`N_OUT = ${info.outputs.length}`)) throw new Error("väärä määrä");
    eq((code.match(/TODO M\d+ \(/g) || []).length, info.outputs.length, "moottorien TODO-rivit");
  });

  test("Väärä roottorin osa tunnistetaan", () => {
    let threw = false;
    try { RS.normalizeModel({ ...RS.MODELS.zippy, thrusters: [{ body: "eiole", x: 0, y: 0 }] }); } catch { threw = true; }
    eq(threw, true, "virhe");
  });
  test("Vienti: väärän kokoiset aivot hylätään", () => {
    const c = deployCase();
    let threw = false;
    try { RS.deployCode("c", { ...c, layers: [3, 8, 2], params: RS.Brain.randomParams([3, 8, 2]) }); } catch { threw = true; }
    eq(threw, true, "virhe");
  });

  /* PID: lineaarinen stabiilisuus (Routh–Hurwitz) */
  test("PID: massa + PI ilman vaimennusta on epästabiili, D-termi vakauttaa", () => {
    const base = { plant: "mass", m: 1, b: 0, kp: 2, ki: 4, kd: 0, T: 3, setpoint: 1, umax: 0, antiWindup: true, dTau: 0 };
    eq(Calc.simulatePid(base).growing, true, "PI");
    eq(Calc.simulatePid({ ...base, kd: 3 }).growing, false, "PID");
  });

  /* Käsivarren nivel */
  const jointBase = { payload: 0.5, length: 0.4, armMass: 0.6, speed: 1, accel: 2,
                      rpm: 60, stallTorque: 1, stallCurrent: 2, noLoadCurrent: 0.2, vNom: 6, vBat: 6, ratio: 10, eff: 0.8 };
  test("Nivel: painovoiman momentti = g·(m·L + M·L/2)", () => {
    near(Calc.jointMotor(jointBase).tGrav, Calc.G * (0.5 * 0.4 + 0.6 * 0.2), 1e-9, "tGrav");
  });
  test("Nivel: hitausmomentti = m·L² + M·L²/3 ja kiihdytysmomentti = J·α", () => {
    const r = Calc.jointMotor(jointBase);
    near(r.J, 0.5 * 0.16 + 0.6 * 0.16 / 3, 1e-12, "J"); near(r.tDyn, r.J * 2, 1e-12, "tDyn");
  });
  test("Nivel: välityssuhde ratioFor30 antaa täsmälleen 30 % pitokuorman", () => {
    const a = Calc.jointMotor(jointBase);
    near(Calc.jointMotor({ ...jointBase, ratio: a.ratioFor30 }).holdLoad, 0.3, 1e-9, "holdLoad");
  });

  /* Sähköjärjestelmä */
  const powerBase = {
    battery: { v: 7.4, mAh: 2000, cRate: 10, burstC: 20, usable: 1 },
    reg: { type: "buck", vOut: 5, eff: 1, maxA: 3, dropout: 1 },
    loads: [{ name: "a", qty: 2, avg: 500, peak: 1000, rail: "bat", kind: "other" }],
    wire: { length: 0, area: 1 },
    driver: { contA: 1, peakA: 3, maxV: 12 },
  };
  test("Käyttöaika = kapasiteetti / keskivirta", () => {
    near(Calc.power(powerBase).runtimeH, 2, 1e-9, "h");
  });
  test("Hakkuri: tulovirta = Vout·Iout / (η·Vin)", () => {
    const r = Calc.power({ ...powerBase, reg: { ...powerBase.reg, eff: 0.8 },
      loads: [{ name: "x", qty: 1, avg: 1000, peak: 1000, rail: "reg", kind: "other" }] });
    near(r.totAvg, 5 / (0.8 * 7.4), 1e-9, "virta");
  });
  test("Lineaarisäädin: tulovirta = lähtövirta, häviö = (Vin−Vout)·I", () => {
    const r = Calc.power({ ...powerBase, reg: { ...powerBase.reg, type: "linear" },
      loads: [{ name: "x", qty: 1, avg: 500, peak: 500, rail: "reg", kind: "other" }] });
    near(r.totAvg, 0.5, 1e-9, "virta"); near(r.regLossAvg, 2.4 * 0.5, 1e-9, "häviö");
  });
  test("Akun jatkuvan virran ylitys antaa virheen", () => {
    const r = Calc.power({ ...powerBase, battery: { ...powerBase.battery, cRate: 0.25 } });
    if (!r.warnings.some((w) => w.level === "err" && w.text.includes("Keskivirta"))) throw new Error("ei varoitusta");
  });
  test("Moottoriohjaimen raja tarkistetaan", () => {
    const r = Calc.power({ ...powerBase, loads: [{ name: "M", qty: 1, avg: 1500, peak: 4000, rail: "bat", kind: "motor" }] });
    eq(r.warnings.filter((w) => w.text.startsWith("M:")).length, 2, "varoituksia");
  });
  test("Johdon resistanssi: 1 m, 1 mm² kuparia ≈ 17,2 mΩ", () => {
    near(Calc.wireResistance(1, 1), 0.01724, 1e-6, "R");
  });

  /* Sarjaportti */
  test("Nimetyt arvot", () => eq(Calc.parseLine("dist:12.5, gyro=-3"), { dist: 12.5, gyro: -3 }));
  test("Välilyönnit kaksoispisteen ympärillä", () => eq(Calc.parseLine("a : 1  b: 2"), { a: 1, b: 2 }));
  test("Pelkät luvut nimetään ch1, ch2…", () => eq(Calc.parseLine("1 2.5\t-3e2"), { ch1: 1, ch2: 2.5, ch3: -300 }));
  test("Teksti ohitetaan", () => eq(Calc.parseLine("Käynnistyy... versio 1.2"), { ch1: 1.2 }));
  test("Tyhjä rivi", () => eq(Calc.parseLine(""), {}));

  /* Rotaatiot */
  const matNear = (A, B, tol, what) => A.forEach((r, i) => r.forEach((v, j) => near(v, B[i][j], tol, `${what}[${i}][${j}]`)));
  const ORDERS = ["ZYX", "XYZ", "ZXY", "YXZ", "ZYZ", "ZXZ"];
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const frame of ["intrinsic", "extrinsic"]) for (const order of ORDERS) {
    test(`Euler ${order} ${frame}: matriisi → kulmat → matriisi`, () => {
      for (let n = 0; n < 50; n++) {
        const ang = [rand() * 6 - 3, rand() * 2.8 - 1.4, rand() * 6 - 3];
        if (order[0] === order[2]) ang[1] = rand() * 3 + 0.05;
        const R = Kin.eulerToMat(ang, order, frame);
        matNear(Kin.eulerToMat(Kin.matToEuler(R, order, frame), order, frame), R, 1e-9, "R");
      }
    });
  }
  test("Sisäinen ZYX = Rz·Ry·Rx", () => {
    const R = Kin.eulerToMat([0.3, -0.4, 1.1], "ZYX");
    matNear(R, Kin.mul(Kin.mul(Kin.rotAxis(2, 0.3), Kin.rotAxis(1, -0.4)), Kin.rotAxis(0, 1.1)), 1e-12, "R");
  });
  test("Sisäinen XYZ = ulkoinen ZYX käänteisillä kulmilla", () => {
    matNear(Kin.eulerToMat([0.2, 0.5, -0.7], "XYZ", "intrinsic"), Kin.eulerToMat([-0.7, 0.5, 0.2], "ZYX", "extrinsic"), 1e-12, "R");
  });
  test("Kardaanilukko (pitch 90°) palauttaa saman rotaation", () => {
    const R = Kin.eulerToMat([0.4, Math.PI / 2, -0.3], "ZYX");
    const a = Kin.matToEuler(R, "ZYX");
    matNear(Kin.eulerToMat(a, "ZYX"), R, 1e-9, "R");
    if (!Kin.gimbalLocked(a, "ZYX")) throw new Error("lukkoa ei tunnistettu");
  });
  test("Kvaternio ↔ matriisi edestakaisin", () => {
    for (let n = 0; n < 50; n++) {
      const q = Kin.quatNormalize([rand() - 0.5, rand() - 0.5, rand() - 0.5, rand() - 0.5]);
      const q2 = Kin.matToQuat(Kin.quatToMat(q));
      const s = Math.sign(q[3]) || 1;
      q.forEach((v, i) => near(q2[i], v * s, 1e-9, "q"));
    }
  });
  test("Akseli–kulma: 90° Z-akselin ympäri", () => {
    const R = Kin.quatToMat(Kin.axisAngleToQuat([0, 0, 1], Math.PI / 2));
    matNear(R, [[0, -1, 0], [1, 0, 0], [0, 0, 1]], 1e-12, "R");
    const aa = Kin.quatToAxisAngle(Kin.matToQuat(R));
    near(aa.angle, Math.PI / 2, 1e-12, "kulma"); near(aa.axis[2], 1, 1e-12, "akseli");
  });
  test("Ortogonaalisuusvirhe tunnistaa väärän matriisin", () => {
    near(Kin.orthoError(Kin.rotAxis(0, 0.7)), 0, 1e-12, "oikea");
    if (Kin.orthoError([[1, 0, 0], [0, 2, 0], [0, 0, 1]]) < 0.5) throw new Error("ei tunnistettu");
  });

  /* Kinematiikka */
  const planar2 = { convention: "classic", joints: [
    { type: "R", theta: 0, d: 0, a: 0.3, alpha: 0, min: -Math.PI, max: Math.PI },
    { type: "R", theta: 0, d: 0, a: 0.25, alpha: 0, min: -Math.PI, max: Math.PI }] };
  const tip = (chain, q) => { const T = Kin.fk(chain, q).at(-1); return [T[0][3], T[1][3], T[2][3]]; };
  test("FK 2R: x = a₁cos q₁ + a₂cos(q₁+q₂)", () => {
    const p = tip(planar2, [0.4, 0.9]);
    near(p[0], 0.3 * Math.cos(0.4) + 0.25 * Math.cos(1.3), 1e-12, "x");
    near(p[1], 0.3 * Math.sin(0.4) + 0.25 * Math.sin(1.3), 1e-12, "y");
  });
  const ur = { convention: "classic", joints: [
    { type: "R", theta: 0, d: 0.089, a: 0, alpha: Math.PI / 2 }, { type: "R", theta: 0, d: 0, a: -0.425, alpha: 0 },
    { type: "R", theta: 0, d: 0, a: -0.392, alpha: 0 }, { type: "R", theta: 0, d: 0.109, a: 0, alpha: Math.PI / 2 },

    const c = { joints: [{ a: 1, theta: 0 }, { a: 1, theta: 0 }] };
    eq(Kin.ik2R(c, 1, 1, true).q.map((v) => +v.toFixed(9)), [1.570796327, -1.570796327], "ylös");
    eq(Kin.ik2R(c, 1, 1, false).q.map((v) => +v.toFixed(9)), [0, 1.570796327], "alas");
  });
  test("IK 2R nollapituisella linkillä ei anna NaN-arvoja", () => {
    const r = Kin.ik2R({ joints: [{ a: 0, theta: 0 }, { a: 1, theta: 0 }] }, 0, 1, true);
    if (r.q.some((v) => !Number.isFinite(v))) throw new Error("NaN");
    eq(r.reachable, true, "ulottuu");
  });
  test("Kulman kääre: 270° → −90°, −180° → 180°", () => {
    near(Kin.wrap(3 * Math.PI / 2), -Math.PI / 2, 1e-12, "270°"); near(Kin.wrap(-Math.PI), Math.PI, 1e-12, "−180°");
  });
  test("BFS ilman vinoliikettä 3×3: lyhin reitti 4", () => {
    eq(Plan.gridSearch({ w: 3, h: 3, occ: new Uint8Array(9) }, [0, 0], [2, 2], { algo: "bfs", diagonal: false }).cost, 4, "pituus");
  });
  test("Varauskartta: log-odds ln 3 → todennäköisyys 0,75", () => {
    near(Plan.probability(Math.log(3)), 0.75, 1e-12, "p"); near(Plan.probability(0), 0.5, 1e-12, "p0");
  });
  test("Vienti: nimen rivinvaihto ja kommentin loppu eivät pääse koodiin", () => {
    eq(RS.commentSafe("auto\n#include <x>\r\n*/ evil()"), "auto #include <x> * / evil()", "puhdistettu");
    eq([RS.pyf(6), RS.cf(0.5), RS.f32str(0.1)], ["6.0", "0.5f", "0.1"], "luvut");
  });

  const failed = results.filter((r) => !r.ok);
  document.getElementById("summary").innerHTML = failed.length
    ? `<b class="fail">${failed.length} / ${results.length} testiä epäonnistui</b>`
    : `<b class="pass">Kaikki ${results.length} testiä läpäisty</b>`;
  document.getElementById("out").innerHTML = results.map((r) =>
    `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✓" : "✗"} ${r.name}${r.msg ? ` — <code>${r.msg}</code>` : ""}</li>`).join("");
  window.testResults = { passed: results.length - failed.length, failed: failed.map((f) => f.name + ": " + f.msg) };
</script>
