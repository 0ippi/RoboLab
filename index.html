<script>
// Automaattitestit (tests-app.html) avaavat sovelluksen osoitteella ?memstore: tallennus menee muistiin
// (testisivun omaan Map-olioon), joten testit eivät koske selaimen oikeisiin projekteihin. Muuten ei vaikutusta.
if (/[?&]memstore\b/.test(location.search) && window.parent !== window && window.parent.__robolabStores) {
  const fake = (m) => {
    const api = {
      getItem: (k) => (m.has(String(k)) ? m.get(String(k)) : null),
      setItem: (k, v) => {
        const q = window.parent.__robolabQuota;
        if (q && String(v).length > q) throw new DOMException("quota", "QuotaExceededError");
        m.set(String(k), String(v));
      },
      removeItem: (k) => { m.delete(String(k)); },
      clear: () => m.clear(),
      key: (i) => [...m.keys()][i] ?? null,
      get length() { return m.size; },
    };
    return new Proxy(api, {
      ownKeys: () => [...m.keys()],
      getOwnPropertyDescriptor: (t, k) => (m.has(k) ? { value: m.get(k), enumerable: true, configurable: true } : undefined),
      get: (t, k) => (k in t ? t[k] : m.get(k)),
    });
  };
  const errs = window.parent.__robolabErrors;
  window.addEventListener("error", (e) => errs.push(String(e.message || e.error)));
  window.addEventListener("unhandledrejection", (e) => errs.push("promise: " + String(e.reason?.message || e.reason)));
  const s = window.parent.__robolabStores;
  Object.defineProperty(window, "localStorage", { value: fake(s.local), configurable: true });
  Object.defineProperty(window, "sessionStorage", { value: fake(s.session), configurable: true });
}
</script>
<!-- 3D-kirjastot ladataan vasta tarvittaessa. Kaikki 3D-näkymät käyttävät samaa Three.js-versiota. -->

        <span class="label">Asetukset</span>

    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- Pääalue -->

    <header class="topbar">

        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <button class="search" id="palette-open">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Hae työkaluja…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="btn install-btn" id="install-app" hidden>
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        <span>Asenna sovellus</span>
      </button>
    </header>

    <div class="work">
      <main class="content" id="content"></main>
      <!-- Kurssin oppitunti työkalun vieressä -->
      <aside class="lesson" id="lesson" hidden aria-label="Oppitunti"></aside>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>

<!-- Komentopaletti -->
<div class="palette-backdrop" id="palette" hidden>
